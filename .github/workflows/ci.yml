# CI
#
# 触发：
#   - push / pull_request 到 main：完整编译 + 测试（PR 与 push 共用）
#   - workflow_call：被 release.yml 复用，保证发布版本经过与分支同等的编译/测试把关
#   - workflow_dispatch：手动触发，用于本地预热 tongsuo 缓存或跑冒烟
#
# 故意不覆盖 dev：dev 是集成/开发分支，不承担 CI 责任。
# dev 上的验证由开发者在本地 dotnet build / dotnet test 走完，合并前必须本地绿。
# 也可手动用 workflow_dispatch 跑一次确认。
#
# 包发布由独立的 release.yml 负责；本 workflow 仅在 push（不含 PR）时把 nupkg 写到
# ./artifacts/ 作为本地兜底，**不**推送到 nuget.org。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

# 最小权限：只读仓库内容；workflow_call 触发时同样受此约束
permissions:
  contents: read

concurrency:
  # 同分支最近一次运行取消，避免 push 后立刻再 push 时的双跑竞争
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tongsuo:
    # RM-0.0.9f：从源码编译 tongsuo，pin 版本并缓存产物，集成阶段必跑。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore apt build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git cmake perl libssl-dev

      # Tongsuo 编译产物按 OS+版本缓存；命中则秒级恢复
      - name: Cache tongsuo build
        id: cache-tongsuo
        uses: actions/cache@v4
        with:
          path: /opt/tongsuo
          key: tongsuo-${{ runner.os }}-v8.4.0
          restore-keys: |
            tongsuo-${{ runner.os }}-

      - name: Build & install tongsuo
        if: steps.cache-tongsuo.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 8.4.0 https://github.com/Tongsuo-Project/Tongsuo.git /tmp/tongsuo
          cd /tmp/tongsuo
          ./config --prefix=/opt/tongsuo enable-ntls enable-sm2 enable-sm3 enable-sm4
          make -j"$(nproc)"
          sudo make install
          /opt/tongsuo/bin/tongsuo version

      - name: Export TONGSUO_PATH
        run: echo "TONGSUO_PATH=/opt/tongsuo/bin/tongsuo" >> "$GITHUB_ENV"

  build:
    runs-on: ubuntu-latest
    needs: tongsuo

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Generate PFX test fixtures (required before test)
        env:
          TONGSUO_PATH: /opt/tongsuo/bin/tongsuo
        run: ./scripts/generate-test-pfx.sh

      - name: Restore
        run: dotnet restore DevTrove.Crypto.slnx

      - name: Build
        run: dotnet build DevTrove.Crypto.slnx --no-restore -c Release

      - name: Test (core, non-integration)
        run: dotnet test DevTrove.Crypto.slnx --no-build -c Release --filter 'Category!=Integration' --collect:"XPlat Code Coverage"

      - name: Test (interop, requires tongsuo)
        env:
          TONGSUO_PATH: /opt/tongsuo/bin/tongsuo
        run: |
          $TONGSUO_PATH version
          dotnet test DevTrove.Crypto.slnx --no-build -c Release --filter 'Category=Integration'

      # push 时把 nupkg 落到 ./artifacts/ 作为本地兜底；PR 不写盘。
      # 不推送 nuget.org —— 推送由 release.yml 独立负责。
      - name: Pack Core (artifacts only, not pushed here)
        if: github.event_name == 'push'
        run: dotnet pack src/DevTrove.Crypto.Core/DevTrove.Crypto.Core.csproj --no-build -c Release -o ./artifacts

      - name: Pack Metapackage (artifacts only, not pushed here)
        if: github.event_name == 'push'
        run: dotnet pack src/DevTrove.Crypto/DevTrove.Crypto.csproj --no-build -c Release -o ./artifacts
